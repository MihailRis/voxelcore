name: Macos Build

on:
  push:
    branches: [ "main", "release-**"]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_call:
    inputs:
      build_name:
        required: true
        type: string
        description: 'Build name passed as VC_BUILD_NAME define'

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'true'

      - name: Install dependencies from brew
        run: |
          brew install glfw3 glew libpng openal-soft luajit libvorbis skypjack/entt/entt googletest glm freetype

      - name: Configure
        run: |
          cmake -DOPENAL_INCLUDE_DIR=$(brew --prefix openal-soft)/include \
           -DOPENAL_LIBRARY=$(brew --prefix openal-soft)/lib/libopenal.dylib \
           -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVOXELENGINE_BUILD_TESTS=ON -DVOXELENGINE_BUILD_APPDIR=1 -DVC_BUILD_NAME="${{ inputs.build_name }}"

      - name: Build
        run: |
          cmake --build build -t install

      - name: Make fix_dylibs.sh executable
        run: chmod +x dev/fix_dylibs.sh

      - name: Fix dylibs
        run: ./dev/fix_dylibs.sh VoxelCore Release build

      - name: Run tests
        run: ctest --output-on-failure --test-dir build

      - name: Run engine tests
        timeout-minutes: 5
        run: |
          chmod +x build/VoxelCore
          chmod +x AppDir/usr/bin/vctest
          AppDir/usr/bin/vctest -e build/VoxelCore -d dev/tests -u build --output-always --debugger "lldb -batch -o 'run' -o 'thread backtrace all' -o 'quit' -- "
      - name: Create DMG
        run: |
          mkdir VoxelCoreDmgContent
          cp -r build/res VoxelCoreDmgContent/
          cp -r build/VoxelCore VoxelCoreDmgContent/
          cp -r build/libs VoxelCoreDmgContent/libs
          hdiutil create VoxelCoreMacApp.dmg -volname "VoxelCore" -srcfolder VoxelCoreDmgContent -ov -format UDZO

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxelCoreMacOs
          path: VoxelCoreMacApp.dmg
